name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Healthy full run (browser lane included) is ~4-6 minutes wall clock. 30min gives generous
    # headroom for a slow runner while still failing fast instead of riding out to GitHub's 6h
    # hard cap on a hung step (see #311/#312: two apt-get hangs that each burned a full 6h runner).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the browser-lane gate diffs against the PR base / previous push
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # pinned to the loom-desk prod bun; bump deliberately
      # The browser e2e lane (real Chromium under bubblewrap) is the expensive 80% of this job:
      # ~105s of tests plus playwright + betterwright + apparmor provisioning. Only pay for it
      # when something that lane covers could have changed; everything else runs the fast lane.
      # Unknown base (force-push, first push) fails open into running the browser lane.
      - name: Decide whether the browser lane runs
        id: lanes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "browser lane: ON (no usable base commit to diff against)"
          elif git diff --name-only "$BASE" "${{ github.sha }}" \
              | grep -qE '^(src/browser/|scripts/ops/browser-smoke|package\.json|bun\.lock|\.github/workflows/ci\.yml)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            echo "browser lane: ON (browser-adjacent paths changed)"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
            echo "browser lane: off"
          fi
      # Installed from the project's pinned release tarball instead of apt: it's a single static
      # binary, so this sidesteps apt-mirror flakiness entirely (see #311/#312) rather than just
      # bounding it. --retry covers a flaky GitHub download; timeout-minutes is the last resort.
      - name: Install shellcheck
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version=0.10.0
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo mv "shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      # apt has no pinned-binary equivalent for bubblewrap/util-linux, so keep apt but make it
      # resilient: non-interactive frontend, apt's own retry setting, and one full retry of
      # update+install if the first attempt fails. Bounded so a stuck mirror fails in minutes.
      - name: Install bubblewrap and util-linux
        if: steps.lanes.outputs.browser == 'true'
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          install_deps() {
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 bubblewrap util-linux
          }
          install_deps || { echo "apt attempt 1 failed, retrying..." >&2; sleep 5; install_deps; }
      - name: Enable and verify browser user namespaces
        if: steps.lanes.outputs.browser == 'true'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --share-net --die-with-parent --ro-bind / / /bin/true
      - run: bun install --frozen-lockfile
      - if: steps.lanes.outputs.browser == 'true'
        run: bun x playwright install --with-deps --no-shell chromium
      # BetterWright drives its bundled BetterChromium, not Playwright's Chromium. Provision
      # it outside bubblewrap: the isolated host intentionally mounts this cache read-only.
      # Without this on a pristine runner, the nested worker cannot bootstrap its browser cache.
      # (`--cloak-only` was removed in betterwright 1.9.x along with CloakBrowser support.)
      - if: steps.lanes.outputs.browser == 'true'
        run: bun x betterwright setup
      - if: steps.lanes.outputs.browser == 'true'
        run: bun run browser:smoke
      - run: shellcheck install.sh deploy/install.sh deploy/deploy-prod.sh
      - run: bash -n install.sh deploy/install.sh deploy/deploy-prod.sh
      - run: bun x tsc --noEmit
      - run: bun run test
      - if: steps.lanes.outputs.browser == 'true'
        run: bun run test:browser
      # Every test above forces process isolation (sandbox: "none") for speed, so it never
      # exercises the bubblewrap wrapper production actually launches through. This is the
      # one test that doesn't — see src/browser/isolated.sandboxed.test.ts (#250).
      - if: steps.lanes.outputs.browser == 'true'
        run: bun run test:browser:sandboxed
